name: Remove Debug Tools (PDB)

on:
  workflow_dispatch:

jobs:
  disable-debug-tools:
    runs-on: ubuntu-latest

    steps:
    - name: Remove PDB via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          # vsdbg 在映像內，只移除注入的 PDB
          kubectl exec deploy/my-app-deploy -c my-app -- rm -f /app/NhiApi.pdb
          if kubectl exec deploy/my-app-deploy -c my-app -- test -f /app/NhiApi.pdb; then
            echo "PDB 仍存在" >&2
            exit 1
          fi
          echo "已移除 /app/NhiApi.pdb（保留映像內 /vsdbg）"
