name: Enable PDB in K3s Pod

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 與目前 pod 內 NhiApi.dll 相同 commit / tag / branch
        required: true
        default: main

jobs:
  enable-pdb:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.git_ref }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build matching PDB
      run: |
        dotnet publish src/NhiApi/NhiApi.csproj -c Debug -o ./pdb-out
        test -f ./pdb-out/NhiApi.pdb

    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Copy PDB into pod
      run: |
        REMOTE="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"
        ssh "${REMOTE}" 'mkdir -p ~/pdb-sync'
        scp ./pdb-out/NhiApi.pdb "${REMOTE}:~/pdb-sync/NhiApi.pdb"
        ssh "${REMOTE}" 'set -euo pipefail
          POD="$(kubectl get pods -l app=my-app -o jsonpath="{.items[0].metadata.name}")"
          if [ -z "${POD}" ]; then
            echo "找不到 app=my-app 的 pod" >&2
            exit 1
          fi
          kubectl cp ~/pdb-sync/NhiApi.pdb "${POD}:/app/NhiApi.pdb" -c my-app
          rm -f ~/pdb-sync/NhiApi.pdb
          kubectl exec "${POD}" -c my-app -- ls -l /app/NhiApi.pdb'
