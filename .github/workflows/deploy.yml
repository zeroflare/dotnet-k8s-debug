name: Build and Deploy to K3s

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up SSH Key & Tunnel
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

        # 建立背景 SSH Tunnel，將 Runner local 5000 對映到 VM local 5000
        ssh -f -N -L 5000:localhost:5000 ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}

    - name: Build image, save matching PDB, push
      run: |
        set -euo pipefail
        SHA="${{ github.sha }}"
        docker build -t "localhost:5000/my-app:${SHA}" .
        # build stage 有與映像 DLL 同源的 PDB（final 已刪掉）
        docker build --target build -t "my-app-build:${SHA}" .
        CID="$(docker create "my-app-build:${SHA}")"
        docker cp "${CID}:/app/publish/NhiApi.pdb" ./NhiApi.pdb
        docker rm "${CID}"
        test -f ./NhiApi.pdb
        docker push "localhost:5000/my-app:${SHA}"
        REMOTE="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"
        ssh "${REMOTE}" "mkdir -p ~/my-app-pdbs/${SHA}"
        scp ./NhiApi.pdb "${REMOTE}:~/my-app-pdbs/${SHA}/NhiApi.pdb"

    - name: Copy k8s manifests
      run: |
        sed -i "s|__IMAGE_TAG__|${{ github.sha }}|g" k8s/my-app.yaml
        ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} 'mkdir -p ~/my-app-k8s'
        scp k8s/* ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/my-app-k8s/

    - name: Deploy to K3s via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          kubectl apply -f ~/my-app-k8s/my-app.yaml
          kubectl rollout status deployment/my-app-deploy --timeout=180s
