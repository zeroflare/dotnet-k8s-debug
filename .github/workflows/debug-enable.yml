name: Enable Debug Tools (PDB)

on:
  workflow_dispatch:

jobs:
  enable-debug-tools:
    runs-on: ubuntu-latest

    steps:
    - name: Inject matching PDB into pod
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          POD="$(kubectl get pods -l app=my-app -o jsonpath='{.items[0].metadata.name}')"
          if [ -z "${POD}" ]; then
            echo "找不到 app=my-app 的 pod" >&2
            exit 1
          fi
          if ! kubectl exec "${POD}" -c my-app -- test -x /vsdbg/vsdbg; then
            echo "映像內沒有 /vsdbg/vsdbg" >&2
            exit 1
          fi
          IMAGE="$(kubectl get deploy my-app-deploy -o jsonpath='{.spec.template.spec.containers[0].image}')"
          SHA="${IMAGE##*:}"
          PDB=~/my-app-pdbs/${SHA}/NhiApi.pdb
          if [ ! -f "${PDB}" ]; then
            echo "找不到與此映像同源的 PDB：${PDB}" >&2
            echo "請確認該次自動部署有成功存檔 PDB" >&2
            exit 1
          fi
          kubectl cp "${PDB}" "${POD}:/app/NhiApi.pdb" -c my-app
          kubectl exec "${POD}" -c my-app -- ls -l /app/NhiApi.dll /app/NhiApi.pdb /vsdbg/vsdbg
          echo "已注入 PDB（image tag=${SHA}）"
