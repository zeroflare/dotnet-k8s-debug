name: Enable Debug Tools (PDB)

on:
  workflow_dispatch:

jobs:
  enable-debug-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
    - name: Set up SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Resolve running image SHA
      id: image
      run: |
        set -euo pipefail
        REMOTE="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"
        IMAGE="$(ssh "${REMOTE}" "kubectl get deploy my-app-deploy -o jsonpath='{.spec.template.spec.containers[0].image}'")"
        SHA="${IMAGE##*:}"
        if [ -z "${SHA}" ] || [ "${SHA}" = "${IMAGE}" ]; then
          echo "無法從 image 解析 SHA：${IMAGE}" >&2
          exit 1
        fi
        echo "image=${IMAGE}"
        echo "sha=${SHA}"
        echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

    - name: Find deploy run for that commit
      id: run
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        SHA="${{ steps.image.outputs.sha }}"
        RUN_ID="$(gh run list \
          --repo "${{ github.repository }}" \
          --workflow deploy.yml \
          --commit "${SHA}" \
          --status success \
          --limit 1 \
          --json databaseId \
          --jq '.[0].databaseId')"
        if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" = "null" ]; then
          echo "找不到 commit ${SHA} 成功的 deploy run（也就沒有 PDB artifact）" >&2
          exit 1
        fi
        echo "run_id=${RUN_ID}"
        echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

    - name: Download PDB artifact
      uses: actions/download-artifact@v4
      with:
        name: NhiApi-pdb-${{ steps.image.outputs.sha }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ steps.run.outputs.run_id }}
        path: pdb-out

    - name: Inject PDB into pod
      run: |
        set -euo pipefail
        test -f ./pdb-out/NhiApi.pdb
        REMOTE="${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}"
        SHA="${{ steps.image.outputs.sha }}"
        scp ./pdb-out/NhiApi.pdb "${REMOTE}:/tmp/NhiApi-${SHA}.pdb"
        ssh "${REMOTE}" "set -euo pipefail
          POD=\"\$(kubectl get pods -l app=my-app -o jsonpath='{.items[0].metadata.name}')\"
          if [ -z \"\${POD}\" ]; then
            echo '找不到 app=my-app 的 pod' >&2
            exit 1
          fi
          kubectl cp \"/tmp/NhiApi-${SHA}.pdb\" \"\${POD}:/app/NhiApi.pdb\" -c my-app
          rm -f \"/tmp/NhiApi-${SHA}.pdb\"
          kubectl exec \"\${POD}\" -c my-app -- ls -l /app/NhiApi.dll /app/NhiApi.pdb
          echo \"已從 GitHub Artifact 注入 PDB（sha=${SHA}）\"
        "
