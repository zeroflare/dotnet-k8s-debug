name: Remove PDB from K3s Pod

on:
  workflow_dispatch:

jobs:
  disable-pdb:
    runs-on: ubuntu-latest

    steps:
    - name: Remove PDB via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -euo pipefail
          kubectl exec deploy/my-app-deploy -c my-app -- rm -f /app/NhiApi.pdb
          if kubectl exec deploy/my-app-deploy -c my-app -- test -f /app/NhiApi.pdb; then
            echo "PDB 仍存在" >&2
            exit 1
          fi
          echo "已移除 /app/NhiApi.pdb"
